# One command:   docker compose up -d        ->  http://localhost:8080   (API docs: /docs)
#
# One service: React dashboard + FastAPI + the local training worker, on this machine.
# Startup never downloads or trains anything:
#   * the starter pack (inside the image) installs telemetry data + trained models for all 81 channels;
#   * if a release bundle is present in ./release/bundle (see README → Release bundle) its datasets
#     are verified and installed into the data volume once - after that everything works offline;
#   * training starts only when you click Train on the Data & Training page (one job at a time,
#     one CPU core left free for the dashboard, resumable, the current model stays active meanwhile).
# Data, models and job history live in the named volumes below and survive restarts and upgrades.
services:
  app:
    image: ${SMC_IMAGE:-space-ml-mission-control:3.1.9}
    build:
      context: .
      args:
        TORCH_INDEX: ${TORCH_INDEX:-https://download.pytorch.org/whl/cpu}
    ports:
      - "${SMC_PORT:-8080}:8000"
    environment:
      SPACEML_BUNDLE_DIR: /bundle
      SPACEML_AUTOSETUP: ${SPACEML_AUTOSETUP:-off}            # off (default) | light | full: opt-in background downloads
      SMC_AUTO_INSTALL: ${SMC_AUTO_INSTALL:-on}                # on (default): fetch missing small mission datasets when online
      SPACEML_TRAIN_CPUS: ${SPACEML_TRAIN_CPUS:-}             # CPUs a training job may use (default: all but one)
      SPACEML_HEAVY_JOBS: ${SPACEML_HEAVY_JOBS:-1}            # training jobs allowed at the same time
      SPACEML_JOB_STALL_MINUTES: ${SPACEML_JOB_STALL_MINUTES:-30}
      SPACEML_MARS_WEIGHTS_URL: ${SPACEML_MARS_WEIGHTS_URL:-} # optional https link to a GPU-trained mars_model.zip
      SPACEML_CORS_ORIGINS: ${SPACEML_CORS_ORIGINS:-http://localhost:5173}
    shm_size: "1gb"               # PyTorch/multiprocessing need more than Docker's 64 MB default
    volumes:
      - ./release/bundle:/bundle:ro # the release bundle (read-only; an empty folder = no bundle)
      - smc-data:/app/data          # installed datasets (writable)
      - smc-models:/app/models      # versioned models + metrics + resumable checkpoints
      - smc-storage:/app/storage    # SQLite (runs, reviews, jobs), run results, uploads, logs
    restart: unless-stopped

  # Release preparation (once, on a machine with internet):
  #   docker compose --profile tools run --rm tools python -m spaceml.release build --out /bundle-out
  #   docker compose --profile tools run --rm tools python -m spaceml.release build --out /bundle-out --from-data --include-models
  tools:
    profiles: ["tools"]
    image: ${SMC_IMAGE:-space-ml-mission-control:3.1.9}
    environment:
      SPACEML_AUTOSETUP: "off"
    shm_size: "1gb"
    volumes:
      - ./release/bundle:/bundle-out
      - smc-data:/app/data
      - smc-models:/app/models
      - smc-storage:/app/storage
    entrypoint: []
    command: ["python", "-m", "spaceml.release", "--help"]

volumes:
  smc-data:
  smc-models:
  smc-storage:
